name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax only (not engine support)
        run: python -m compileall -q harness tests tools

  reference-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install hashed reference environment
        run: python -m pip install --require-hashes --only-binary=TA-Lib -r requirements.txt
      - name: Install project without resolving outside the lock
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile all Python sources
        run: python -m compileall -q harness tests tools
      - name: Checksum-pinned local scanner
        run: python tools/download_gitleaks.py --output artifacts/release/scanner
      - name: Git-history preflight (fail closed before the full suite)
        run: python tools/scan_git_history.py --scanner artifacts/release/scanner/gitleaks.exe --report artifacts/release/history-preflight.json
      - name: Test
        run: python tests/run_tests.py --workers 4
      - name: Isolated hashed release tools
        run: |
          python -m venv artifacts/release/tools-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          artifacts/release/tools-env/Scripts/python -m pip install --require-hashes -r requirements-release.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          artifacts/release/tools-env/Scripts/python -m pip check
      - name: Runtime and release-tool advisory gates
        run: |
          artifacts/release/tools-env/Scripts/python -m pip_audit -r requirements.txt --disable-pip --strict -f json -o artifacts/release/runtime-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          artifacts/release/tools-env/Scripts/python -m pip_audit -r requirements-release.txt --disable-pip --strict -f json -o artifacts/release/tools-audit.json
      - name: Build distributions
        run: artifacts/release/tools-env/Scripts/python -m build --outdir artifacts/release/dist
      - name: Distribution metadata
        run: artifacts/release/tools-env/Scripts/python -m twine check --strict artifacts/release/dist/*
      - name: Archive, source and private-state gate
        run: python tools/check_release.py --dist artifacts/release/dist --report artifacts/release/archive-check.json --gitleaks artifacts/release/scanner/gitleaks.exe
      - name: Git-history secret gate
        run: python tools/scan_git_history.py --scanner artifacts/release/scanner/gitleaks.exe --report artifacts/release/history-scan.json
      - name: Installed-wheel offline execution (no checkout imports)
        run: |
          python -m venv artifacts/release/wheel-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          artifacts/release/wheel-env/Scripts/python -m pip install --require-hashes --only-binary=TA-Lib -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem artifacts/release/dist/*.whl).FullName
          artifacts/release/wheel-env/Scripts/python -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          artifacts/release/wheel-env/Scripts/python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokePython = (Resolve-Path artifacts/release/wheel-env/Scripts/python.exe).Path
          $smokeScript = (Resolve-Path tools/smoke_wheel.py).Path
          $smokeOutput = Join-Path $env:RUNNER_TEMP 'zora-wheel-smoke-output'
          Set-Location $env:RUNNER_TEMP
          & $smokePython $smokeScript --output $smokeOutput
      - name: Save receipts (never virtualenvs, credentials or raw research)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-receipts
          path: |
            artifacts/regression/**/*.json
            artifacts/regression/**/*.xml
            artifacts/regression/**/*.txt
            artifacts/release/*audit.json
            artifacts/release/archive-check.json
            artifacts/release/history-scan.json
            artifacts/release/history-preflight.json
            ${{ runner.temp }}/zora-wheel-smoke-output/result.json
